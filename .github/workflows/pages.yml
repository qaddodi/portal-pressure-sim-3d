# The only workflow in this repo: build the site and publish it on GitHub Pages, plus ONE full test run a day (owner, 25 Nov: allowed for that run only; every push still tests only
# what it touched, in the cloud thread, before the push). No browser runs.
#
#   /          the live site, built from main (until main has the app, a redirect to /preview/)
#   /preview/  the integration branch claude/project-thread-ge1swr, with the orange "PREVIEW · <commit>" pill
#   /beta/     the testers' stable copy (owner, 28 Nov, P-03): the branch claude/beta, which moves ONLY when the owner says (`git push origin <commit>:claude/beta`); built like the preview. No such branch: no /beta/. (Named claude/* so the github-pages environment already allows it.)
#
# The feedback address is the repository SECRET FEEDBACK_EMAIL (Settings > Secrets and variables > Actions > Secrets), never a file in the repo, so the run's log masks it (a
# variable printed in the log's env dump; moved to a secret 25 Nov). Unset, the Send feedback row is absent.
# Either push rebuilds both, so the two copies are always one consistent site (after a merge into main, /preview/ equals the live site).
#
# Fast on purpose (Plan 50, owner: "from writing code to push to me testing online should be very, very extremely fast"; target about 80 s from push to live):
#   - node_modules come back from the Actions cache (keyed on package-lock.json): no npm ci on a hit.
#   - The baked files (charts, skins, welds, organs) come back from the cache too, and each bake skips itself when what it is made from is unchanged (scripts/bake-sig.mjs, the charts' own key).
#     A push re-bakes only what it touched; the four bakes run at once (scripts/build.mjs).
#   - No sleep: the artifact is polled for, up to 20 seconds, and the deploy starts the moment it is listed.
#   - Main is only checked out (and built) once it has an app.
name: Pages

on:
  push:
    branches: [main, claude/project-thread-ge1swr, claude/beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # (a newer push cancels an older deploy; the daily test job below is NOT cancelled with it)
    concurrency:
      group: pages
      cancel-in-progress: true
    outputs:
      tests_due: ${{ steps.started.outputs.cache-hit != 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment3.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # main first, only package.json: whether main has the app decides if it is built at all
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
          # (the whole history: the release gate compares the commit its record names with HEAD, scripts/release-gate.mjs)
          fetch-depth: 0
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-ge1swr
          path: preview
      # the testers' copy: only when the owner has made the branch (a missing one is not an error)
      - id: betabranch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" claude/beta >/dev/null 2>&1; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.betabranch.outputs.has == 'true'
        uses: actions/checkout@v4
        with:
          ref: claude/beta
          path: beta
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # (Whether today's test run has started is a free lookup (no download), so a push that finds it started starts no test job at all.)
      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: started
        uses: actions/cache/restore@v4
        with:
          path: preview/.tests-started
          key: tests-started-${{ steps.day.outputs.d }}
          lookup-only: true
      # restore and save are separate steps on purpose: a push that lands while a run is going CANCELS it (the deploy job's concurrency), and the plain cache action saves only when the whole job
      # succeeds, so a cold run (about 3 minutes of bakes) that kept being cancelled would never fill the cache. Each save runs the moment its files exist, and the bakes' save runs even on a cancel.
      - name: Restore node_modules
        id: modules
        uses: actions/cache/restore@v4
        with:
          path: preview/node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('preview/package-lock.json') }}
      # The last bakes, newest first (restore-keys): each bake's signature (or the charts' key) says which of them is stale. Only the bake outputs are listed, never public/anatomy/organs.bin
      # (a checked-in source that a restore must not replace).
      - name: Restore the baked files
        uses: actions/cache/restore@v4
        with:
          path: |
            preview/public/baked
            preview/public/lobule
            preview/public/anatomy/skins.bin
            preview/public/anatomy/skins.bin.sig
            preview/public/anatomy/circuit-skins.bin
            preview/public/anatomy/circuit-skins.bin.sig
            preview/public/anatomy/organs-baked.bin
            preview/public/anatomy/organs-baked.bin.sig
          key: bakes-${{ github.sha }}
          restore-keys: bakes-
      - name: Install packages (only without a cached node_modules)
        if: steps.modules.outputs.cache-hit != 'true'
        working-directory: preview
        run: npm ci
      - name: Save node_modules
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: preview/node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('preview/package-lock.json') }}
      - name: Build the preview (integration branch) into site/preview
        working-directory: preview
        env:
          VITE_CHANNEL: preview
          VITE_FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL }}
        run: |
          VITE_BUILD="claude/project-thread-ge1swr@$(git rev-parse --short=8 HEAD)" npm run build
          mkdir -p ../site
          cp -r dist ../site/preview
      # (a bake writes its signature only after its file is whole, and a chart file is written whole per deck: what a cancelled build left is safe to keep, and the next run finishes the rest)
      - name: Save the baked files
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            preview/public/baked
            preview/public/lobule
            preview/public/anatomy/skins.bin
            preview/public/anatomy/skins.bin.sig
            preview/public/anatomy/circuit-skins.bin
            preview/public/anatomy/circuit-skins.bin.sig
            preview/public/anatomy/organs-baked.bin
            preview/public/anatomy/organs-baked.bin.sig
          key: bakes-${{ github.sha }}
      # The beta copy shares the preview's node_modules (the same lock file is expected; npm ci runs when they differ) and its baked files (each bake skips itself when unchanged).
      - name: Build the beta copy (claude/beta) into site/beta
        if: steps.betabranch.outputs.has == 'true'
        working-directory: beta
        env:
          VITE_CHANNEL: preview
          VITE_FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL }}
        run: |
          if ! cmp -s package-lock.json ../preview/package-lock.json; then npm ci; else ln -s ../preview/node_modules node_modules; fi
          VITE_BUILD="beta@$(git rev-parse --short=8 HEAD)" npm run build
          cp -r dist ../site/beta
      - name: Build the live site (main) into site/
        env:
          VITE_FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL }}
        run: |
          if grep -q '"build"' live/package.json; then
            git -C live sparse-checkout disable
            cd live
            npm ci
            VITE_CHANNEL=live VITE_BUILD="main@$(git rev-parse --short=8 HEAD)" npm run build
            cp -r dist/. ../site/
          else
            echo "main has no app yet: / redirects to /preview/"
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./preview/"><title>Portal Pressure 3D</title><a href="./preview/">Open the preview</a>' > site/index.html
          fi
      # The artifact's name carries the attempt: a re-run of a run (Re-run failed jobs) uploads again into the SAME run, and two artifacts named "github-pages" made deploy-pages stop with
      # "Multiple artifacts named github-pages were unexpectedly found" (25 Nov, a16515d0). One name per attempt, handed to deploy-pages below, so a re-run always deploys its own.
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      # GitHub lists a freshly uploaded artifact a moment late: deploy-pages straight after the upload sometimes finds "No artifacts named github-pages" (runs 4, 42 and 1579).
      # Instead of a fixed sleep, wait until this run lists it (usually the first or second look), up to 20 seconds.
      - name: Wait until the artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages-${{ github.run_attempt }}" and (.expired | not))] | length' 2>/dev/null || echo 0)
            if [ "$n" -ge 1 ]; then echo "artifact listed after $i look(s)"; exit 0; fi
            sleep 1
          done
          echo "artifact not listed after 20 s; deploying anyway"
      # Run 1579 root cause: the listing above already showed the artifact on the first look, yet deploy-pages' own metadata fetch (a different, slower-to-update read)
      # answered "Found 0 artifact(s)" one second later. Runs 1825 and 1826 (25 Nov) failed the other way: GitHub itself answered "Failed to create deployment (status: 500)", and the preview
      # kept serving a build two commits old while a thread called its fix live. Both are GitHub-side hiccups that a later look gets past, so the deploy is tried up to three times, 15 s and
      # then 45 s apart (deploy-pages does not hand over the status code, so any failure is retried; a real bad deploy fails all three and the job fails, red, as before).
      # scripts/preview-live.mjs is the other half: after a push it polls /preview/build-info.txt until it names the commit, and says so plainly when it does not.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before the second deploy attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before the third deploy attempt
        if: steps.deployment2.outcome == 'failure'
        run: sleep 45
      - id: deployment3
        if: steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # One full run of the suite a day (W6; its count is in this job's log, never on the pill). Started by the first push of a UTC day (a skipped job costs no minutes); a started marker is saved first, so a run that dies
  # is not retried until tomorrow. Its own concurrency group and never cancelled: a push that cancels the deploy above must not kill an hour-long run. The result is the job's log line
  # (scripts/tests-daily.mjs; nothing stamps it on the site). It never fails a deploy.
  tests:
    needs: deploy
    if: needs.deploy.outputs.tests_due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    concurrency:
      group: tests-daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-ge1swr
          path: preview
      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # (looked at again: a run queued behind another one finds the day already taken)
      - id: started
        uses: actions/cache/restore@v4
        with:
          path: preview/.tests-started
          key: tests-started-${{ steps.day.outputs.d }}
          lookup-only: true
      - if: steps.started.outputs.cache-hit != 'true'
        run: date -u +%FT%TZ > preview/.tests-started
      - if: steps.started.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: preview/.tests-started
          key: tests-started-${{ steps.day.outputs.d }}
      - if: steps.started.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: modules
        if: steps.started.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: preview/node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('preview/package-lock.json') }}
      - if: steps.started.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            preview/public/baked
            preview/public/lobule
            preview/public/anatomy/skins.bin
            preview/public/anatomy/skins.bin.sig
            preview/public/anatomy/circuit-skins.bin
            preview/public/anatomy/circuit-skins.bin.sig
            preview/public/anatomy/organs-baked.bin
            preview/public/anatomy/organs-baked.bin.sig
          key: bakes-none
          restore-keys: bakes-
      - name: Install packages (only without a cached node_modules)
        if: steps.started.outputs.cache-hit != 'true' && steps.modules.outputs.cache-hit != 'true'
        working-directory: preview
        run: npm ci
      - name: Run the whole suite
        if: steps.started.outputs.cache-hit != 'true'
        working-directory: preview
        run: node scripts/tests-daily.mjs
