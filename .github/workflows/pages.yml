# The only workflow in this repo: build the site and publish it on GitHub Pages. Build only: no tests, no browser runs (owner's rule:
# no Actions minutes for checks; tests run in the cloud thread, fast and targeted, before a push).
#
#   /          the live site, built from main (until main has the app, a redirect to /preview/)
#   /preview/  the integration branch claude/project-thread-ge1swr, with the orange "PREVIEW · <commit>" pill
#
# Either push rebuilds both, so the two copies are always one consistent site (after a merge into main, /preview/ equals the live site).
name: Pages

on:
  push:
    branches: [main, claude/project-thread-ge1swr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-ge1swr
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - name: Build the preview (integration branch) into site/preview
        working-directory: preview
        env:
          VITE_CHANNEL: preview
        run: |
          npm ci
          VITE_BUILD="claude/project-thread-ge1swr@$(git rev-parse --short=8 HEAD)" npm run build
          mkdir -p ../site
          cp -r dist ../site/preview
      - name: Build the live site (main) into site/
        run: |
          if [ -f live/package.json ] && grep -q '"build"' live/package.json; then
            cd live
            npm ci
            VITE_CHANNEL=live VITE_BUILD="main@$(git rev-parse --short=8 HEAD)" npm run build
            cp -r dist/. ../site/
          else
            echo "main has no app yet: / redirects to /preview/"
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./preview/"><title>Portal Pressure 3D</title><a href="./preview/">Open the preview</a>' > site/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
