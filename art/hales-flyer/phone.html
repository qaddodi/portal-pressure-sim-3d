<!doctype html><html lang="en"><head><meta charset="utf-8"><title>About Hales Engine (iPhone)</title><style>
/* The iPhone flyer: 390 x 844 pt pages, the size of the iPhone tester guide, so a phone shows a page at its own width with no zoom.
   No words live here: render.cjs pours the blocks of flyer.html into these pages, one after another, starting a new page when the next block does not fit. */
@page{size:390pt 844pt;margin:0}
html,body{margin:0;padding:0}
body{font-family:'Liberation Serif','FreeSerif',serif;color:#3a2a1c}
.page{width:390pt;height:844pt;position:relative;overflow:hidden;break-after:page;background:#F3EAD7 url(paper-tile.jpg) 0 0/390pt auto repeat}
.page::before{content:'';position:absolute;inset:9pt;border:1.2pt solid #4a3424;outline:0.6pt solid #4a3424;outline-offset:2.5pt;pointer-events:none}
.content{position:absolute;top:30pt;left:26pt;right:26pt;bottom:50pt;display:flex;flex-direction:column;gap:9pt}
.foot{position:absolute;left:26pt;right:26pt;bottom:20pt;font-size:8.5pt;line-height:1.2;color:#5a4330;border-top:0.5pt solid #9b8467;padding-top:4pt;text-align:center}
.title,.title *{text-align:center}   /* (every line of a title, over the page-wide p rule below) */
.title h1{margin:4pt 0 0;font-size:25pt;letter-spacing:0.14em;padding-left:0.14em;font-weight:700;color:#3a2618;line-height:1.1}
.title p{margin:3pt 0 0;font-style:italic;font-size:12.5pt;color:#5a4330}
.title.section h1{font-size:18.5pt;letter-spacing:0.1em;padding-left:0.1em}
.fig img{width:100%;display:block}
h2{font-size:15.5pt;margin:4pt 0 0;font-variant:small-caps;letter-spacing:.04em;color:#7A2A22}
p{margin:0;font-size:14.5pt;line-height:1.36;text-align:left}
ul{margin:0;padding-left:1.1em;font-size:14.5pt;line-height:1.36} li{margin:0 0 4pt}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:5pt 12pt;font-size:12.5pt;line-height:1.22;border-top:0.5pt solid #9b8467;border-bottom:0.5pt solid #9b8467;padding:6pt 0}
.legend b{color:#7A2A22;font-variant:small-caps;letter-spacing:.03em}
.credits{font-size:10pt;line-height:1.3;color:#5a4330;text-align:center;border-top:0.5pt solid #9b8467;padding-top:6pt;margin-top:auto}
.unit{display:flex;flex-direction:column;gap:5pt}
</style></head><body></body></html>
